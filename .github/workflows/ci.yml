name: WinUI CI
on:
  push:
    branches: [winui, 'audit/**']
  pull_request:
    branches: [winui]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test src/TeleClean.Tests/TeleClean.Tests.csproj -c Release --logger trx
      - run: dotnet build src/TeleClean.App/TeleClean.App.csproj -c Release -p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: TeleClean-win-x64
          path: src/TeleClean.App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/
