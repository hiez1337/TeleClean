name: WinUI CI
on:
  push:
    branches: [winui, 'audit/**']
  pull_request:
    branches: [winui]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test src/TeleClean.Tests/TeleClean.Tests.csproj -c Release --logger trx
      - name: Publish self-contained Windows executable
        run: dotnet publish src/TeleClean.App/TeleClean.App.csproj -c Release -p:Platform=x64 -p:PublishProfile=WinX64 -p:DebugType=none --artifacts-path artifacts/single-file-build -o artifacts/publish
      - name: Stage TeleClean.exe
        shell: pwsh
        run: |
          if (@(Get-ChildItem -LiteralPath artifacts/publish -Recurse -File).Count -ne 1) {
            throw 'Single-file publish produced unexpected sidecar files.'
          }
          Copy-Item -LiteralPath artifacts/publish/TeleClean.App.exe -Destination artifacts/TeleClean.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TeleClean-win-x64
          path: artifacts/TeleClean.exe
          if-no-files-found: error
