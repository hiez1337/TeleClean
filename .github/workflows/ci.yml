name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libegl-mesa0

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest -v --tb=short
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

  build:
    needs: test
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Inject API keys
        run: |
          echo '{"api_id":${{ secrets.TELEGRAM_API_ID }},"api_hash":"${{ secrets.TELEGRAM_API_HASH }}"}' > keys.json

      - name: Build .exe
        run: pyinstaller --onefile --windowed --name "TeleClean" --add-data "app\gui\styles\telegram_dark.qss;app\gui\styles" --add-data "app\gui\styles\telegram_light.qss;app\gui\styles" --add-data "keys.json;." --hidden-import telethon --hidden-import qrcode --hidden-import PIL --hidden-import dotenv --collect-all telethon --exclude-module PySide6.Qt3DAnimation --exclude-module PySide6.Qt3DCore --exclude-module PySide6.Qt3DExtras --exclude-module PySide6.Qt3DInput --exclude-module PySide6.Qt3DLogic --exclude-module PySide6.Qt3DRender --exclude-module PySide6.QtBluetooth --exclude-module PySide6.QtCharts --exclude-module PySide6.QtDataVisualization --exclude-module PySide6.QtDesigner --exclude-module PySide6.QtGraphs --exclude-module PySide6.QtGraphsWidgets --exclude-module PySide6.QtHelp --exclude-module PySide6.QtHttpServer --exclude-module PySide6.QtLocation --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtMultimediaWidgets --exclude-module PySide6.QtNetworkAuth --exclude-module PySide6.QtNfc --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtOpenGLWidgets --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.QtPrintSupport --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuick3D --exclude-module PySide6.QtQuickControls2 --exclude-module PySide6.QtQuickWidgets --exclude-module PySide6.QtRemoteObjects --exclude-module PySide6.QtScxml --exclude-module PySide6.QtSensors --exclude-module PySide6.QtSerialBus --exclude-module PySide6.QtSerialPort --exclude-module PySide6.QtSpatialAudio --exclude-module PySide6.QtSql --exclude-module PySide6.QtStateMachine --exclude-module PySide6.QtSvg --exclude-module PySide6.QtSvgWidgets --exclude-module PySide6.QtTest --exclude-module PySide6.QtTextToSpeech --exclude-module PySide6.QtUiTools --exclude-module PySide6.QtWebChannel --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebSockets --exclude-module PySide6.QtWebView --exclude-module PySide6.QtXml --exclude-module PySide6.QtConcurrent --exclude-module PySide6.QtDBus --noconfirm main.py

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: TeleClean.exe
          path: dist/TeleClean.exe

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "TeleClean v1.0.${{ github.run_number }}"
          body: |
            Автоматическая сборка из ветки main.
            - Commit: ${{ github.sha }}
            - Python 3.12 + PySide6
            - API-ключи вшиты, .env не требуется
          files: dist/TeleClean.exe
          generate_release_notes: false
          make_latest: true
